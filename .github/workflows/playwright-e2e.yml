name: Playwright E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Playwright test runner for CI workspace
        run: pnpm add -Dw @playwright/test@1.55.0 --lockfile=false

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: TypeScript
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Run Playwright matrix
        run: pnpm exec playwright test

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
