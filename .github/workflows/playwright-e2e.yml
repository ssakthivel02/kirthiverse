name: Playwright E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Install pinned Playwright and axe runners for CI workspace
        run: pnpm add -Dw @playwright/test@1.55.0 @axe-core/playwright@4.10.2 --lockfile=false

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: TypeScript
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Run Playwright matrix
        run: pnpm exec playwright test

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
