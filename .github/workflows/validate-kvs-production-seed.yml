name: Validate KVS production seed

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KVS_RELEASE_CHANNEL: preview
      KVS_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      KVS_SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full release contract
        run: pnpm run check

      - name: Guard production output
        run: |
          test -f dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html
          ! grep -RniE 'manus-analytics|debug-collector|__MANUS_HOST_DEV__' dist
          test -f dist/release-status.json
          test -f dist/deployment-metadata.json
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('dist/release-status.json')); if(r.buildCommit!==process.env.KVS_BUILD_COMMIT) { console.error('release-status buildCommit mismatch', r.buildCommit, process.env.KVS_BUILD_COMMIT); process.exit(1) }"
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('dist/deployment-metadata.json')); if(d.commit!==process.env.KVS_BUILD_COMMIT||d.sourceRef!==process.env.KVS_SOURCE_REF) { console.error('deployment metadata provenance mismatch', d.commit, d.sourceRef, process.env.KVS_BUILD_COMMIT, process.env.KVS_SOURCE_REF); process.exit(1) }"
