name: Validate KVS production seed

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full release contract
        run: pnpm run check

      - name: Guard production output
        run: |
          test -f dist/index.html
          ! grep -q '/src/main.tsx' dist/index.html
          ! grep -RniE 'manus-analytics|debug-collector|__MANUS_HOST_DEV__' dist
