name: Validate KirthiVerse parity

on:
  push:
    branches: [integration/arivukids-parity]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate preserved learning platform
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s 404.html
          test -s ai-tutor.html
          test -s math-world.html
          test -s science-world.html
          test -s tamil-world.html
          test -s english-world.html
          test -s coding-world.html
          test -s art-world.html
          test -s privacy.html
          test -s terms.html
          test -s manifest.json || test -s manifest.webmanifest
          test -s service-worker.js || test -s sw.js
          test -s ARIVUKIDS_DONOR_COMMIT.txt
          test "$(tr -d '\r\n ' < ARIVUKIDS_DONOR_COMMIT.txt)" = "8dcdd3a9e4e36c2723da17ec9b93af70569acdea"
          ! test -e CNAME
          ! grep -RIl --exclude-dir=.git 'arivukids.omsaravanabhava.org' . | grep -q '^./CNAME$'
          html_count=$(find . -maxdepth 2 -type f -name '*.html' | wc -l)
          test "$html_count" -ge 20
          echo "Validated HTML pages: $html_count"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          if [ -f service-worker.js ]; then node --check service-worker.js; fi
          if [ -f sw.js ]; then node --check sw.js; fi
