name: Deploy KirthiVerse Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source
        run: |
          pnpm run validate:kvs-supplement
          pnpm run type-check
          pnpm run lint

      - name: Build production site
        run: pnpm run build

      - name: Production output guard
        run: |
          rm -rf dist/__manus__ dist/.manus-logs
          if grep -RniE 'manus-analytics|debug-collector|__MANUS_HOST_DEV__' dist; then
            echo 'Development/Manus runtime artifact detected in production output.'
            exit 1
          fi
          test -f dist/index.html
          if grep -q '/src/main.tsx' dist/index.html; then
            echo 'Uncompiled TSX entry detected in production output.'
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
